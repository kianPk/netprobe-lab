name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install client
        run: npm ci
        working-directory: client
      - name: Install server
        run: npm ci
        working-directory: server
      - name: Server syntax check
        run: node --check index.js
        working-directory: server
      - name: Build client
        run: npm run build
        working-directory: client
